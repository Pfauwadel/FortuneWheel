<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roue de la Fortune</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <meta name="theme-color" content="#0b0d11">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then((registration) => registration.update())
                    .catch((error) => console.log('Échec SW : ', error));
            });
            // Écran public sans saisie utilisateur : on peut se recharger
            // automatiquement dès qu'une nouvelle version est disponible.
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
        }
    </script>
</head>

<body>
    <div class="stage-bg"></div>

    <a class="admin-link help-link" href="guide.html" title="Guide & documentation">?</a>
    <a class="admin-link" href="admin.html" title="Administration">⚙</a>

    <header class="stage-head">
        <div class="stage-eyebrow"><i></i><span id="wheel-brand">Roue de la Fortune</span><i></i></div>
        <h1 id="wheel-title">Tentez votre chance</h1>
    </header>

    <div id="wheel-container">
        <div class="wheel-rim">
            <div id="wheel"></div>
        </div>
        <div class="wheel-hub" id="wheel-hub"></div>
        <div id="pointer"></div>
    </div>

    <button id="spin">Tourner la roue</button>
    <div id="result"></div>

    <div class="ticker">
        <div class="ticker-track" id="ticker-track"></div>
    </div>

    <script src="js/icon-library.js"></script>
    <script src="js/theme-library.js"></script>
    <script src="js/config-store.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/wheel.js"></script>
</body>

</html>
